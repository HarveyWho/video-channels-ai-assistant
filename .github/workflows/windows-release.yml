name: Windows release
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements build.txt
      - name: Install build dependencies
        run: python -m pip install -r "requirements build.txt"
      - name: Test core behavior
        run: python -m unittest -v tests
      - name: Check OCR and GUI construction from source
        shell: pwsh
        run: |
          python app.py --self-check "Source Self Check.json"
          if ($LASTEXITCODE -ne 0) { Get-Content "Source Self Check.json"; throw "Source self-check failed" }
      - name: Build the Windows directory bundle
        run: python package.py
      - name: Check the packaged EXE
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'Frozen Self Check.json'
          $process = Start-Process -FilePath '.\dist\Live Answer Assistant\Live Answer Assistant.exe' -ArgumentList @('--self-check', ('"{0}"' -f $report)) -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged self-check failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Packaged self-check did not pass' }
      - uses: actions/upload-artifact@v7
        with:
          name: Windows package
          path: release/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Self check reports
          path: |
            Source Self Check.json
            ${{ runner.temp }}/Frozen Self Check.json
          if-no-files-found: ignore

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Windows package
          path: release
      - name: Upload the verified package to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "release/Live.Answer.Assistant.Windows.zip" "release/SHA256.txt" --repo "$GITHUB_REPOSITORY" --clobber
