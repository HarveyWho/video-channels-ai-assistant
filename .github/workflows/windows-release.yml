name: Windows release
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'bundled_models.json'
      - 'Model Manifests/**'
      - 'Install Offline.*'
      - 'requirements*.txt'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 70
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements build.txt
      - name: Install build dependencies
        run: python -m pip install -r "requirements build.txt"
      - name: Test core behavior
        run: python -m unittest -v tests
      - name: Check OCR and GUI construction from source
        shell: pwsh
        run: |
          python app.py --self-check "Source Self Check.json"
          if ($LASTEXITCODE -ne 0) { Get-Content "Source Self Check.json"; throw "Source self-check failed" }
      - name: Build the Windows directory bundle
        run: python package.py
      - name: Check the packaged EXE
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'Frozen Self Check.json'
          $process = Start-Process -FilePath '.\dist\Live Answer Assistant\Live Answer Assistant.exe' -ArgumentList @('--self-check', ('"{0}"' -f $report)) -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged self-check failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Packaged self-check did not pass' }
      - name: Bundle pinned Ollama and both models, check real responses, and split archive
        run: python build_offline.py
      - name: Verify generated setup against final offline volumes
        shell: pwsh
        run: |
          Expand-Archive 'release/Windows.Offline.Setup.zip' 'release/Setup Test'
          $env:LIVE_ASSISTANT_SETUP_TEST = '1'
          & 'release/Setup Test/Install Offline.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Final offline setup failed' }
          $package = Get-Content 'release/Offline Package.json' -Raw | ConvertFrom-Json
          $installed = Join-Path 'release' ('Live Answer Assistant v' + $package.version)
          $exe = Join-Path $installed 'Live Answer Assistant.exe'
          $report = Join-Path $env:RUNNER_TEMP 'Offline Frozen Self Check.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-check', ('"{0}"' -f $report)) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installed offline EXE self-check failed' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Installed offline self-check did not pass' }
          Remove-Item $installed -Recurse -Force
          Remove-Item 'release/Setup Test' -Recurse -Force
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Release checks
          path: |
            Source Self Check.json
            ${{ runner.temp }}/*Self Check.json
            release/Bundled*Check.json
            release/Offline*Package.json
            release/SHA256.txt
          if-no-files-found: ignore
          retention-days: 14
