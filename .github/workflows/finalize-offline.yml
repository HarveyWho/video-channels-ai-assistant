name: Finalize verified offline upload
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-offline.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify the previously tested upload and publish it
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: '1'
        run: |
          import json, os, pathlib, subprocess, tempfile
          from publish_release import gh
          from build_offline import sha256
          repo = os.environ['GITHUB_REPOSITORY']
          tag = 'v0.3.0-rc1'
          source = '8c7ebc126bae7361bf4ea491b43ecd962ef80342'
          changed = set(subprocess.check_output(['git','diff','--name-only',source,'HEAD'], encoding='utf-8').splitlines())
          assert changed <= {'publish_release.py','.github/workflows/finalize-offline.yml'}, changed
          jobs = json.loads(gh('api','repos/'+repo+'/actions/runs/45631894345/jobs'))['jobs']
          steps = {s['name']: s['conclusion'] for j in jobs for s in j['steps']}
          for name in ['Test core behavior','Check OCR and GUI construction from source','Check the packaged EXE',
                       'Bundle pinned Ollama and both models, check real responses, and split archive',
                       'Verify generated setup against final offline volumes']:
              assert steps[name] == 'success', name
          release = next(r for r in json.loads(gh('api','repos/'+repo+'/releases?per_page=100')) if r['tag_name'] == tag)
          assert release['target_commitish'] == source
          assets = {a['name']: a for a in release['assets']}
          with tempfile.TemporaryDirectory() as folder:
              gh('release','download',tag,'--repo',repo,'--dir',folder,'--pattern','SHA256.txt',
                 '--pattern','Bundled Model Check.json','--pattern','Offline Package.json')
              root = pathlib.Path(folder)
              assert assets['SHA256.txt']['digest'] == 'sha256:'+sha256(root/'SHA256.txt')
              for line in (root/'SHA256.txt').read_text().splitlines():
                  digest, name = line.split('  ',1)
                  assert assets[name]['state'] == 'uploaded' and assets[name]['digest'] == 'sha256:'+digest, name
              models = json.loads((root/'Bundled Model Check.json').read_text(encoding='utf-8'))
              assert models['status'] == 'passed'
              assert {m['model'] for m in models['models']} == {'qwen3.5:2b','qwen3.5:4b'}
              package = json.loads((root/'Offline Package.json').read_text())
              assert package['version'] == '0.3.0-rc1'
              for part in package['parts']:
                  assert assets[part['name']]['size'] == part['size'] < 2*1024**3
                  assert assets[part['name']]['digest'] == 'sha256:'+part['sha256']
              print(json.dumps({'models':models,'package':package}))
          gh('release','edit',tag,'--repo',repo,'--draft=false','--prerelease')
          print('Verified and published '+release['html_url'])
